server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 客服后端接口（与 vite.config.js 开发代理行为一致）
    location /api/ {
        proxy_pass http://customer-service:18082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://customer-service:18082;
        proxy_set_header Host $host;
    }

    # 电商后端接口：/commerce/xxx -> /xxx（与 vite rewrite 一致）
    location /commerce/ {
        proxy_pass http://ecommerce:18081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 单页应用回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
