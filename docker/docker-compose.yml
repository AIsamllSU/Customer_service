services:
  mysql:
    image: mysql:8.4
    container_name: customer-service-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: customer_service
      MYSQL_PASSWORD: Cs123456
    ports:
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  ecommerce:
    build: ../ecommerce-service-backend
    container_name: customer-service-ecommerce
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://customer_service:Cs123456@mysql:3306/commerce?charset=utf8mb4
      APP_HOST: 0.0.0.0
      APP_PORT: "18081"
    ports:
      - "18081:18081"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:18081/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  customer-service:
    build: ../customer-service-backend
    container_name: customer-service-backend
    restart: unless-stopped
    # LLM_API_KEY 等大模型配置从 backend 的 .env 注入（不进入镜像）；
    # 数据库与电商服务地址由下方 environment 覆盖为容器网络地址
    env_file: ../customer-service-backend/.env
    environment:
      DATABASE_URL: mysql+aiomysql://customer_service:Cs123456@mysql:3306/customer_service?charset=utf8mb4
      COMMERCE_API_BASE_URL: http://ecommerce:18081
      APP_HOST: 0.0.0.0
      APP_PORT: "18082"
    ports:
      - "18082:18082"
    depends_on:
      mysql:
        condition: service_healthy
      ecommerce:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:18082/openapi.json', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build: ../customer-service-frontend
    container_name: customer-service-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      customer-service:
        condition: service_healthy

volumes:
  mysql_data:
